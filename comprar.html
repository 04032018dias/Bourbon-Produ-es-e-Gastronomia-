<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprar ingresso — Bourbon Neon Match</title>
<style>:root{--pink:#ff35c8;--blue:#28d7ff;--green:#72ff42;--yellow:#ffd51f;--red:#ff3851}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#15132a,#03040a 55%);color:#fff;font-family:Arial}.wrap{max-width:620px;margin:auto;padding:18px}.brand{text-align:center;font-size:30px;font-weight:900;text-shadow:0 0 14px var(--pink);margin:12px 0}.brand span{display:block;color:var(--blue)}.card{background:#090d18;border:1px solid #29314c;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 0 24px #0008}.hero{border-color:var(--pink);box-shadow:0 0 24px #ff35c833}.lot{display:grid;grid-template-columns:1fr auto;gap:10px;border-radius:15px;padding:14px;margin:10px 0;background:#05070d}.lot.green{border:1px solid var(--green)}.lot.yellow{border:1px solid var(--yellow)}.lot.red{border:1px solid var(--red)}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #35415d;background:#080b13;color:#fff;margin:6px 0 10px;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:13px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(90deg,#8e0b68,var(--pink));margin-top:10px}.btn.whats{background:#169b4c}.muted{color:#b9c0cf;font-size:13px}.total{font-size:28px;color:var(--pink);font-weight:900}.ok{border-color:#2cd87b;color:#9affc1}.err{border-color:#ff3851;color:#ff9aaa}</style></head><body><div class="wrap">
<div class="brand">BOURBON <span>NEON MATCH</span></div>
<div class="card hero"><h2 id="eventName">Bourbon Neon Match</h2><p>📅 <span id="eventDate">08/08/2026</span> · <span id="eventTime">20:00</span></p><p>📍 <span id="eventLocation">Cravo e Canela</span></p><p class="muted">Verde, amarelo ou vermelho: qual é o seu status hoje?</p></div>
<div class="card"><b>1. Escolha seu ingresso</b><div id="lots"></div><label>Quantidade<input id="qty" type="number" min="1" value="1"></label><div>Total: <span id="total" class="total">R$ 0,00</span></div></div>
<div class="card"><b>2. Seus dados</b><input id="name" placeholder="Nome completo"><input id="phone" placeholder="WhatsApp"><input id="cpf" placeholder="CPF (opcional)"><input id="email" type="email" placeholder="E-mail (opcional)"><select id="promoter"><option value="">Quem indicou? (promoter)</option></select></div>
<div class="card"><b>3. Pagamento</b><select id="payment"><option>Pix</option><option>Link Stone</option><option>Dinheiro</option><option>Cartão na portaria</option></select><p class="muted">O pedido será enviado para a equipe. O QR Code é liberado após a confirmação do pagamento.</p><button class="btn" id="send">Enviar pedido</button><button class="btn whats" id="whats">Comprar pelo WhatsApp</button></div><div id="result"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<script>const $=id=>document.getElementById(id),money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let db=null,event=null,selectedLot=null,promoters=[];const eventId=new URLSearchParams(location.search).get('event');
function render(){if(!event)return;$('eventName').textContent=event.name;$('eventDate').textContent=(event.date||'').split('-').reverse().join('/');$('eventTime').textContent=event.time||'';$('eventLocation').textContent=event.location||'';$('lots').innerHTML=(event.lots||[]).filter(l=>l.active!==false).map(l=>`<label class="lot ${l.statusColor||''}"><span><b>${l.name}</b><br><small>${money(l.price)}</small></span><input type="radio" name="lot" value="${l.id}"></label>`).join('');document.querySelectorAll('input[name=lot]').forEach(r=>r.onchange=()=>{selectedLot=event.lots.find(l=>l.id===r.value);calc()});if(!selectedLot&&event.lots?.[0]){selectedLot=event.lots[0];const r=document.querySelector(`input[value="${selectedLot.id}"]`);if(r)r.checked=true}calc()}
function calc(){$('total').textContent=money((selectedLot?.price||0)*(Number($('qty').value)||1))}$('qty').oninput=calc;
async function init(){try{const cfg=window.BOURBON_FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||cfg.apiKey.includes('COLE_AQUI'))throw new Error('Firebase ainda não foi configurado.');firebase.initializeApp(cfg);db=firebase.firestore();const state=await db.collection('bourbon').doc('state').get();const d=state.data()||{};event=(d.events||[]).find(e=>e.id===eventId)||(d.events||[])[0];promoters=d.promoters||[];$('promoter').innerHTML+=""+promoters.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');if(!event)throw new Error('Evento não encontrado.');render()}catch(e){event={id:'neon-local',name:'Bourbon Neon Match',date:'2026-08-08',time:'20:00',location:'Cravo e Canela',lots:[{id:'verde',name:'Sinal Verde (Liberado)',price:15,statusColor:'green',active:true},{id:'amarelo',name:'Amarelo Alerta (Duvidoso)',price:20,statusColor:'yellow',active:true},{id:'vermelho',name:'Vermelho Parou (Perigo)',price:25,statusColor:'red',active:true}]};render();$('result').innerHTML=`<div class="card err">${e.message} Você ainda pode comprar pelo WhatsApp.</div>`}}
function data(){const q=Math.max(1,Number($('qty').value)||1),p=promoters.find(x=>x.id===$('promoter').value);return{name:$('name').value.trim(),phone:$('phone').value.trim(),cpf:$('cpf').value.trim(),email:$('email').value.trim(),eventId:event.id,eventName:event.name,lotId:selectedLot?.id,lotName:selectedLot?.name,unitPrice:Number(selectedLot?.price)||0,qty:q,total:(Number(selectedLot?.price)||0)*q,promoterId:p?.id||'',promoterName:p?.name||'',paymentMethod:$('payment').value,status:'Pendente',createdAt:new Date().toISOString()}}
$('send').onclick=async()=>{const o=data();if(!o.name||!o.phone||!o.lotId)return alert('Informe nome, WhatsApp e escolha o ingresso.');if(!db)return alert('Use o botão Comprar pelo WhatsApp enquanto o Firebase não estiver configurado.');try{const ref=await db.collection('vendas_online').add(o);$('result').innerHTML=`<div class="card ok"><b>Pedido enviado!</b><p>Número: ${ref.id.slice(0,8).toUpperCase()}</p><p>A equipe confirmará o pagamento e enviará o QR Code pelo WhatsApp.</p></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){alert(e.message)}};
$('whats').onclick=()=>{const o=data(),text=`Olá! Quero comprar ingresso para *${o.eventName}*%0AIngresso: ${o.lotName||''}%0AQuantidade: ${o.qty}%0ATotal: ${money(o.total)}%0ANome: ${o.name||''}%0ATelefone: ${o.phone||''}%0APromoter: ${o.promoterName||'não informado'}`;location.href='https://wa.me/?text='+encodeURIComponent(text.replace(/%0A/g,'\n'))};init();</script></body></html>
