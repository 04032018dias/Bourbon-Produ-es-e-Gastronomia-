<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bourbon Portaria</title><style>*{box-sizing:border-box}body{margin:0;background:#03050c;color:#fff;font-family:Arial}.wrap{max-width:520px;margin:auto;padding:18px}.brand{text-align:center;font-size:30px;font-weight:900;color:#ff37ca;text-shadow:0 0 12px #ff37ca;margin:15px}.card{background:#0a0e19;border:1px solid #29324b;border-radius:18px;padding:16px;margin:12px 0}.btn{width:100%;padding:15px;border:0;border-radius:13px;background:#1e72dc;color:#fff;font-weight:900;font-size:16px;margin-top:9px}.green{background:#169c53}.red{background:#c63b45}.ok{border:2px solid #3cff86;color:#a9ffc8}.bad{border:2px solid #ff4055;color:#ffabb5}input{width:100%;padding:13px;background:#050813;color:#fff;border:1px solid #38445f;border-radius:12px;font-size:17px}</style></head><body><div class="wrap"><div class="brand">BOURBON PORTARIA</div><div class="card"><div id="reader"></div><p>Ou digite o código:</p><input id="code" placeholder="Código do ingresso"><button class="btn" id="check">Validar ingresso</button></div><div id="result"></div></div>
<script src="https://unpkg.com/html5-qrcode"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>const $=id=>document.getElementById(id);let db=null,state=null;async function init(){try{const c=window.BOURBON_FIREBASE_CONFIG;if(!c||!c.apiKey||c.apiKey.includes('COLE_AQUI'))throw new Error('Configure o Firebase.');firebase.initializeApp(c);db=firebase.firestore();await load();const qr=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:240,height:240}},false);qr.render(code=>validate(code),()=>{})}catch(e){$('result').innerHTML=`<div class="card bad">${e.message}</div>`}}async function load(){const d=await db.collection('bourbon').doc('state').get();state=d.data()||{tickets:[],events:[]}}async function validate(code){code=(code||'').trim().toUpperCase();await load();const t=(state.tickets||[]).find(x=>(x.code||'').toUpperCase()===code);if(!t)return show(false,'Ingresso não encontrado');const ev=(state.events||[]).find(e=>e.id===t.eventId);if(t.status==='Aguardando pagamento'||t.status==='Pagamento parcial')return show(false,'Pagamento não confirmado',t,ev);if(t.used)return show(false,'Ingresso já utilizado em '+(t.usedAt||''),t,ev);t.used=true;t.usedAt=new Date().toLocaleString('pt-BR');await db.collection('bourbon').doc('state').set({tickets:state.tickets},{merge:true});show(true,'ENTRADA LIBERADA',t,ev)}function show(ok,msg,t={},ev={}){$('result').innerHTML=`<div class="card ${ok?'ok':'bad'}"><h2>${msg}</h2><p><b>${t.buyer||''}</b></p><p>${ev.name||''}</p><p>${t.code||''}</p></div>`} $('check').onclick=()=>validate($('code').value);init();</script></body></html>
