<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17110c"><title>Bourbon Produções e Gastronomia</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header><h1><span>BOURBON</span> Produções e Gastronomia</h1><p id="badge">Sistema integrado</p></header>
<main>
<section id="login" class="view active"><div class="card"><h2>Entrar</h2><label>E-mail<input id="email" type="email"></label><label>Senha<input id="password" type="password"></label><button id="loginBtn">Entrar</button><button id="forgotBtn" class="blue">Esqueci minha senha</button><button id="showRegister" class="gold">Criar acesso</button><p id="msg"></p></div><div id="registerCard" class="card hidden"><h2>Criar acesso</h2><p class="notice">O primeiro usuário será Administrador. Os demais aguardam liberação.</p><label>Nome<input id="name"></label><label>E-mail<input id="newEmail" type="email"></label><label>Senha<input id="newPassword" type="password"></label><button id="registerBtn">Cadastrar</button></div></section>
<section id="dashboard" class="view"><div class="stats"><div><small>Funcionários</small><b id="statEmployees">0</b></div><div><small>Bandas</small><b id="statBands">0</b></div><div><small>Usuários</small><b id="statUsers">0</b></div><div><small>Acessos</small><b id="statLogins">0</b></div></div><div class="grid"><button data-view="employees">👥<b>Funcionários</b><small>Cadastro e situação</small></button><button data-view="bands">🎤<b>Bandas</b><small>Cadastro e contatos</small></button><button data-view="users">🔐<b>Usuários</b><small>Perfis e permissões</small></button><button data-view="audit">📋<b>Auditoria</b><small>Histórico de alterações</small></button></div><button id="logoutBtn" class="red">Sair</button></section>
<section id="employees" class="view"><div class="bar"><h2>Funcionários</h2><button data-view="dashboard" class="blue small">Voltar</button></div><div class="card"><label>Nome<input id="employeeName"></label><label>Função<input id="employeeRole"></label><label>Telefone<input id="employeePhone"></label><label>Diária<input id="employeeDaily" type="number" step="0.01"></label><button id="saveEmployee">Salvar funcionário</button></div><div id="employeesList"></div></section>
<section id="bands" class="view"><div class="bar"><h2>Bandas</h2><button data-view="dashboard" class="blue small">Voltar</button></div><div class="card"><label>Nome da banda<input id="bandName"></label><label>Responsável<input id="bandContact"></label><label>Telefone<input id="bandPhone"></label><label>Valor combinado<input id="bandFee" type="number" step="0.01"></label><button id="saveBand">Salvar banda</button></div><div id="bandsList"></div></section>
<section id="users" class="view"><div class="bar"><h2>Usuários</h2><button data-view="dashboard" class="blue small">Voltar</button></div><div id="usersList"></div></section>
<section id="audit" class="view"><div class="bar"><h2>Auditoria</h2><button data-view="dashboard" class="blue small">Voltar</button></div><div id="auditList"></div></section>
</main><script type="module" src="app.js"></script></body></html>
